<text x="203" y="292" font-size="19" fill="#333" font-weight="bold" font-style="italic" text-anchor="middle">S<tspan font-size="13" dy="5">1</tspan></text>
<text x="643" y="292" font-size="19" fill="#333" font-weight="bold" font-style="italic" text-anchor="middle">S<tspan font-size="13" dy="5">2</tspan></text>
